
name: Windows Tailscale Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tailscale-check:
    runs-on: windows-2022
    timeout-minutes: 10

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Verify connection
        shell: pwsh
        run: |
          tailscale status
          $ip = tailscale ip -4

          if (-not $ip) {
            throw "Tailscale IP was not assigned"
          }

          Write-Output "Tailscale IPv4: $ip"
          Write-Output "Connection check completed"
