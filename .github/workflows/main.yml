
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:ci

      - name: Verify connection
        shell: pwsh
        run: |
          tailscale status
          $ip = tailscale ip -4

          if (-not $ip) {
            throw "Tailscale IP was not assigned"
          }

          Write-Output "Tailscale IPv4: $ip"
