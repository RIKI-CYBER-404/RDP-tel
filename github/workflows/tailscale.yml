
name: Tailscale Network Check

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  tailscale-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci

      - name: Verify connection
        run: |
          tailscale status
          tailscale ip -4
